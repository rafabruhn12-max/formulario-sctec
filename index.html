<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset=" UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário</title>
</head>

<body>
    <form action="">

        <!-- Nome completo -->
        <label for="nome">Nome completo: </label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Seu nome" required> <br>




        <!-- E-mail -->
        <label for="email">E-mail: </label>
        <input type="email" id="email" name="email" placeholder="Ex: seuemail@email.com" required> <br>

        <!--  Idade -->
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" max="120" placeholder="Ex: 25" required>

        <!-- Qual materia esta se candidatando uma opcao  -->
        <fieldset>
            <legend>Para qual matéria você está se candidatando para lecionar?
            </legend>

            <!-- radio garante que escolha apenas um  -->
            <label for="radio">Matérias</label>
            <select name="materia" id="materia">

                <option value="disables selected">Escolha uma opção...</option>
                
                <option value="matematica">Matemática</option>
                <option value="portugues">Português</option>
                <option value="biologia">Biologia</option>
                <option value="ciencias">Ciências</option>
                <option value="historia">História</option>
                <option value="geografia">Geografia</option>
                <option value="artes">Artes</option>

            </select>
        </fieldset>

        <!-- turnos disponiveis uma opcao -->

        <!-- Nivel de escolaridade uma opcao -->
         <label for="escolaridade">Nível de escolaridade:</label>
                <select name="escolaridade" id="escolaridade">
                    <option value="disables selected">Escolha uma opção...</option>
                    <option value="superior-completo">Superior completo</option>
                    <option value="cursando-mestrado">Cursando mestrado</option>
                    <option value="mestrado-completo">Mestrado completo</option>
                    <option value="cursando-doutorado">Cursando doutorado</option>
                    <option value="doutorado-completo">Doutorado completo</option>
                </select> <br>

        <!-- descricao sobre si mesmo 200 caracteres-->
        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" id="mensagem" cols="30" rows="5" minlength="200 required"></textarea>

        <input type="submit" value="Enviar mensagem">
    </form>
</body>

</html>
